version: 1
name: SDLCForge Platform Modernization
leadProject: core-server
waves:
    - name: Framework Naming Cleanup
      planGroups:
        - name: Rename pluggable-express to plugable-express
          slug: pluggable-express-rename
          description: 'Correct the double-g misspelling. npm package name is already single-g and all consumers already depend on it correctly - remaining scope: directory rename, GitHub repo rename (liquid-labs/pluggable-express, requires gh CLI auth), main/Makefile build-artifact refs still pointing at dist/pluggable-express.js (open followup in that repo; original code-generator provenance unrecoverable, needs manual fix), package.json repository/bugs/homepage URLs, README/AGENTS.md/REVIEW.md refs, in-repo comments, and refresh of core-server''s .yalc local link afterward.'
          plans:
            core-server: PLACEHOLDER
            plugable-express-cli: PLACEHOLDER
            pluggable-express: PLACEHOLDER
        - name: Rename pluggable-defaults to plugable-defaults
          slug: pluggable-defaults-rename
          description: 'Newly discovered second double-g-misspelled repo (not part of the original request, found during investigation). Directory, package.json name/main/repository/bugs/homepage, and the GitHub repo itself (liquid-labs/pluggable-defaults) are all still double-g - has not had even the npm-name-level fix pluggable-express already got. Carries a live latent bug: liq-work and sdlcpilot-cli already depend on the single-g spec @liquid-labs/plugable-defaults, which does not exist in the registry yet. Independent of the pluggable-express rename; can run in parallel.'
          plans:
            liq-work: PLACEHOLDER
            pluggable-defaults: PLACEHOLDER
            sdlcpilot-cli: PLACEHOLDER
    - name: Plugin Consolidation — Framework and Dev-Core
      planGroups:
        - name: Fold documentation and integrations mechanism into plugable-express
          slug: framework-consolidation
          description: Fold @liquid-labs/plugable-server-documentation (generic server self-documentation, zero SDLC coupling) and @liquid-labs/liq-integrations (generic hook-registry/provider-resolution mechanism, built on the shared liq-plugins-lib also used by unrelated liq-policy/liq-roles, zero SDLC coupling) into @liquid-labs/plugable-express itself, eliminating both as separate packages. liq-integrations-issues-github (the concrete GitHub provider, real business logic, depends on liq-projects-lib) is explicitly NOT part of this fold - it stays product-level, tracked in core-server-domain-consolidation.
          dependencies:
            - pluggable-express-rename
          plans:
            liq-integrations: PLACEHOLDER
            plugable-server-documentation: PLACEHOLDER
            pluggable-express: PLACEHOLDER
