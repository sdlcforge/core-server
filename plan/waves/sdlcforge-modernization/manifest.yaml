version: 1
name: SDLCForge Platform Modernization
leadProject: core-server
waves:
    - name: Framework Naming Cleanup
      planGroups:
        - name: Rename pluggable-express to plugable-express
          slug: pluggable-express-rename
          description: 'Correct the double-g misspelling. npm package name is already single-g and all consumers already depend on it correctly — remaining scope: directory rename, GitHub repo rename (liquid-labs/pluggable-express, via authenticated gh CLI), main/Makefile build-artifact refs still pointing at dist/pluggable-express.js (open followup in that repo), package.json repository/bugs/homepage URLs, README/AGENTS.md/REVIEW.md refs, in-repo comments, and refresh of core-server''s .yalc local link afterward. UPDATE 2026-08-14: pluggable-express project''s own slice is COMPLETE (all 4 phase-1 tasks landed, phase-review passed clean, directory renamed) — the project-index slug for this participant changed from pluggable-express to plugable-express as a result; the plans map key below was updated to match so this participant resolves correctly going forward.'
          plans:
            core-server: pluggable-express-rename
            plugable-express: pluggable-express-rename
            plugable-express-cli: pluggable-express-rename
        - name: Rename pluggable-defaults to plugable-defaults
          slug: pluggable-defaults-rename
          description: 'Second double-g-misspelled repo (not part of the original request, found during investigation). CORRECTED 2026-08-14: the package was originally named single-g (plugable-defaults) and published to npm as @liquid-labs/plugable-defaults@1.0.0-alpha.4 in Nov 2023 — that publish is still live and is what liq-work, sdlcpilot-cli, and pluggable-express all successfully resolve today via ^1.0.0-alpha.4. There is NO live/latent registry bug. A later commit (cba16b2, ''plugable'' -> ''pluggable'') regressed the local package name back to double-g, and two further version bumps (alpha.5, alpha.6) were made under the double-g name but never published under either name. Real scope: (1) revert the local directory/package.json/repo naming back to single-g, undoing the regression; (2) decide whether/when to publish the currently-unpublished alpha.5/alpha.6 content under the corrected single-g name so consumers can pick up the newer code; (3) resolve the GitHub repo-name situation before any gh repo rename — liquid-labs/plugable-defaults and liquid-labs/pluggable-defaults currently both resolve (via redirect) to the same repo object, canonical name needs confirming first. Independent of the pluggable-express rename; can run in parallel. UPDATE 2026-08-14: pluggable-defaults project''s own slice is COMPLETE (all 5 phase-1 tasks landed, phase-review passed clean, GitHub repo renamed to liquid-labs/plugable-defaults, package.json/package-lock.json/src corrected, @liquid-labs/plugable-defaults@1.0.0-alpha.7 published to npm, directory renamed) — the project-index slug for this participant changed from pluggable-defaults to plugable-defaults as a result; the plans map key below was updated to match so this participant resolves correctly going forward. liq-work and sdlcpilot-cli''s own verification-only slices are still pending.'
          plans:
            liq-work: pluggable-defaults-rename
            plugable-defaults: pluggable-defaults-rename
            sdlcpilot-cli: pluggable-defaults-rename
    - name: Plugin Consolidation — Framework and Dev-Core
      planGroups:
        - name: Fold documentation and integrations mechanism into plugable-express
          slug: framework-consolidation
          description: 'Fold @liquid-labs/plugable-server-documentation (server self-documentation) and @liquid-labs/liq-integrations (hook-registry/provider-resolution mechanism) into @liquid-labs/plugable-express as built-in framework capability, eliminating both as separate packages. liq-integrations-issues-github stays product-level, tracked in core-server-domain-consolidation. Plan authored 2026-08-15: 4 phases across the 3 participants (plugable-express phases 1-2: absorb + doc-updates, 6+1 tasks; liq-integrations phase 3: retire, 4 tasks; plugable-server-documentation phase 4: retire, 4 tasks). plugable-express is the fold-in target and must land (Phase 1) before the other two projects'' retirement phases execute.'
          dependencies:
            - pluggable-express-rename
          plans:
            liq-integrations: framework-consolidation
            plugable-express: framework-consolidation
            plugable-server-documentation: framework-consolidation
        - name: Fold domain-specific plugins into core-server
          slug: core-server-domain-consolidation
          description: 'Fold liq-controls, liq-credentials, and liq-integrations-issues-github''s functionality directly into core-server''s own codebase as in-tree modules, retiring all three donor repos. Registering an in-tree module as a plugin has no supported mechanism in @liquid-labs/plugable-express today, so plugable-express is a 5th participant adding a minimally-scoped appInit `builtinPlugins` affordance (its own plan slice, own phases). Also unblocks dev-core-consolidation''s last remaining task (liq-projects-lib phase 10 task 003), which needs determineCurrentMilestone inlined into liq-integrations-issues-github before it can complete. core-server''s own plan (phases 3-7: baseline, mechanism-gate, absorb, doc-updates, release) is fully authored as of 2026-08-24.'
          plans:
            core-server: core-server-domain-consolidation
            liq-controls: core-server-domain-consolidation
            liq-credentials: core-server-domain-consolidation
            liq-integrations-issues-github: core-server-domain-consolidation
            plugable-express: core-server-domain-consolidation
        - name: Create sdlcforge/dev-core
          slug: dev-core-consolidation
          description: 'Merge liq-projects, liq-work, liq-orgs, and plugable-projects-audit into a new sdlcforge/dev-core package. liq-projects-lib retires once liq-work absorbs its sole surviving single-consumer usage (crossLinkDevProjects); determineCurrentMilestone inlines into liq-integrations-issues-github separately under core-server-domain-consolidation. Lead-project-for-this-slice: liq-projects (most central of the four functional participants; liq-work explicitly orchestrates atop it).'
          plans:
            liq-orgs: dev-core-consolidation
            liq-projects: dev-core-consolidation
            liq-projects-lib: dev-core-consolidation
            liq-work: dev-core-consolidation
            plugable-projects-audit: dev-core-consolidation
        - name: Rename sdlcpilot-cli to sdlcforge/core-cli
          slug: sdlcpilot-cli-rename
          description: 'Rename @liquid-labs/sdlcpilot-cli to @sdlcforge/core-cli (GitHub org transfer + npm scope move, corrected mid-planning from an originally-assumed sdlc-cli target to the already-live core-cli name, confirmed by the user). UPDATE 2026-08-15: COMPLETE. All 5 phase-1 tasks landed (GitHub identity verified, package.json/bun.lock identity updated, build artifacts and self-references renamed including a manager-approved fix for an unrelated pre-existing @liquid-labs/plugable-defaults PLUGABLE_REGISTRY export removal, version bumped to 1.0.0-alpha.11, directory relocated to sdlcforge/core-cli), phase-review gate passed (one trivial minor finding fixed via follow-up dispatch), plan finalized and merged to main. The project-index slug for this participant changed from sdlcpilot-cli to core-cli as a result; the plans map key below was updated to match. Remaining open item (tracked in this project''s own plan/followups.yaml, not blocking): npm publish --access public --tag alpha for @sdlcforge/core-cli@1.0.0-alpha.11 still needs to be run manually by the user - blocked in this environment by the Claude Code permission classifier and an npm registry 401 credential issue, matching the sibling pluggable-defaults-rename plan''s own precedent. Separate from the CLI/server binary-unification question raised for a later wave - this was just the rename/relocation.'
          plans:
            core-cli: sdlcpilot-cli-rename
    - name: Dev-Core Consumer Migration
      planGroups:
        - name: Migrate core-server to consume sdlcforge/dev-core
          slug: dev-core-migration
          description: core-server has not yet repointed from the four donor packages (liq-projects, liq-work, liq-orgs, plugable-projects-audit) that dev-core-consolidation already absorbed into @sdlcforge/dev-core. Swap all four explicitPlugins entries for a single @sdlcforge/dev-core entry per dev-core's own docs/consumer-migration.md handoff spec, which fully specifies the required edits per donor.
          plans:
            core-server: dev-core-migration
    - name: Compile-Time Plugin Manifest
      planGroups:
        - name: Implement compile-time plugin manifest framework
          slug: compile-time-manifest-framework
          description: In plugable-express, replace today's runtime/reflective plugin composition (undeclared app.ext service coupling) with a compile-time plugin manifest framework (a plugable.yaml declaring provides/requires/optional per plugin) — the mechanism-level fix for undeclared runtime app.ext coupling bugs (e.g. ynGa, the GITHUB_API credential-registration-order risk).
          plans:
            plugable-express: compile-time-manifest
        - name: Define compile-time plugin manifest for core-server
          slug: compile-time-manifest-sdlc-server
          description: Using the compile-time manifest framework from compile-time-manifest-framework (plugable-express), define core-server's own SDLC-specific plugin manifest declaring provides/requires/optional for its plugin set, replacing the current explicitPlugins runtime array's implicit ordering with a declared, checkable one. Fixes bug ynGa and closes the GITHUB_API credential-registration-order gap. Depends on the dev-core-migration plan-group landing first so core-server's manifest work targets its post-migration plugin set (dev-core), not the four soon-to-be-retired donor packages.
          dependencies:
            - compile-time-manifest-framework
            - dev-core-migration
          plans:
            core-server: sdlc-plugin-manifest
    - name: Unified CLI and MCP Binaries
      planGroups:
        - name: Merge core-server and dev-core into sdlc-core
          slug: sdlc-core-unification
          description: 'Architecture analysis (2026-09-05) confirmed: the core-server/dev-core package split is not a real architectural boundary — both are plain {handlers, setup} modules registered into plugable-express (the actual generic-framework/business-logic boundary), core-server''s own customization is ~204 lines of config contributing 6 of 165 routes, and the two packages have a cyclic runtime dependency (core-server#controls requires dev-core#orgs; dev-core#projects requires core-server#credentials) that today shows up as a permanently-allowlisted plugin-manifest gate failure plus yalc-link drift. Merge core-server + dev-core into @sdlcforge/sdlc-core as a single package with 7 internal components (credentials, projects, orgs, controls, issues-github, work, projects-audit) in DAG order, each declared in plugable.host.builtins so the compile-time manifest can assert outcome:ok instead of allowlisting the ordering violation. Internal component boundary (src/<component>/{index.mjs,setup.mjs,...}, no cross-component imports, app.ext-only coupling) replaces the package boundary — consider an ESLint no-restricted-imports rule to enforce it mechanically. plugable-express remains the one real package boundary above sdlc-core; third-party sdlc-projects-* plugins remain real package boundaries below it — neither is absorbed. Refresh the yalc snapshot before merging so the stale appExt:_liqOrgs.orgSetupMethods drift clears first rather than looking merge-introduced. Follows the dev-core-consolidation absorption recipe (docs/dev-core-consolidation-contract.md) — same hazards apply (root-file ownership, src/index.mjs add/add conflict, plan/ residue, file: dependency specs). Separately flagged (not in this plan-group''s scope): handler parameters lack JSON-schema typing needed for the later cli-mcp-binary-generation MCP frontend — a plugable-express change, currently unowned. Plan authored 2026-09-05/06 (slug sdlc-core-unification), lead project core-server (both participants scored zero centrality; core-server selected as absorption target per precedent).'
          plans:
            core-server: sdlc-core-unification
            dev-core: sdlc-core-unification
        - name: Generate installable CLI and MCP encapsulations from sdlc-core
          slug: cli-mcp-binary-generation
          description: 'Once sdlc-core exists (sdlc-core-unification), generate sdlcforge/core-cli and sdlcforge/sdlc-mcp as installable encapsulations of the logic embedded in sdlc-core. UPDATE 2026-08-14: corrected name — core-cli, not sdlc-cli (Wave 2''s sdlcpilot-cli-rename plan-group confirmed the target name is @sdlcforge/core-cli, matching the already-live GitHub repo transfer). core-cli is the already-renamed CLI product rebuilt on the sdlc-core basis; sdlc-mcp is a new MCP-frontend package. Builds on the Bun single-binary packaging already validated by the sdlcpilot-cli Phase 0 spike (bun build --compile confirmed viable for the git/gh/npm shell-out pattern; shelljs found incompatible with any bundled Bun output - recommend replacing it with raw node:child_process in liq-projects/dev-core beforehand, per followup hwbY). Architecture should also allow for a future localhost/browser-based GUI product atop sdlc-core, though the GUI itself is out of scope here. sdlc-mcp is not a participant yet since it does not exist as an indexed project at authoring time.'
          dependencies:
            - sdlc-core-unification
          plans:
            sdlcpilot-cli: PLACEHOLDER
