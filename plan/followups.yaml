    - title: yalc push propagated stale build once
      id: CJ9P
      date: "2026-08-14"
      tags:
        - type:enhancement
        - priority:medium
        - effort:unspecified
      text: 'RECURRED (2026-08-24, core-server-domain-consolidation plan-group, Phase 4 task 001''s read-only verify gate): the manager''s pre-dispatch `yalc push` from plugable-express again propagated a stale, pre-feature dist/ build (core-server''s .yalc/ snapshot''s dist/plugable-express.js had zero occurrences of the just-landed builtinPlugins mechanism despite package.json reporting a matching version). Confirmed root cause this time: plugable-express''s own working-tree dist/ was itself 8 days stale — `yalc push` did not trigger prepack (`make build`) as package.json''s `prepack: make build` script implies it should. Workaround applied: explicitly ran `make build` in plugable-express before `yalc push`, confirmed via grep on the packed bundle. This is now a confirmed, reproducible defect (or at least a reproducible operational gotcha) rather than a one-off: `yalc push` cannot be trusted to rebuild dist/ on its own in this project. Recommend either (a) confirming why prepack isn''t firing on `yalc push` specifically (it may only fire on `npm pack`/`npm publish`, not yalc''s own packing path) and documenting that yalc callers must always `make build` first, or (b) wrapping the project''s yalc-push workflow (a script, or a Makefile target) that runs `make build && yalc push` atomically so this can''t be forgotten again. Originally: during phase-3 (yalc-dependency-refresh) task execution of the pluggable-express-rename plan, the same symptom occurred (missing a registerPathVar plugin-setup parameter), resolved then via forced rebuild + re-push.'
    - title: IntegrationsManager de-dup collapses provider
      id: uROI
      date: "2026-08-24"
      tags:
        - type:bug
        - plan/phase:absorption-baseline
        - plan/slug:core-server-domain-consolidation
        - priority:unspecified
        - effort:unspecified
      text: IntegrationsManager.listInstalledPlugins() (in @liquid-labs/plugable-express) de-duplicates its provider list via new Map(list.map((p) => [p.name, p])). Both register() call sites in @liquid-labs/liq-integrations-issues-github's setup (tickets and pull request providers) omit the name field, so both are keyed on undefined and the Map collapses them into one entry — the later pull request registration silently overwrites the earlier tickets registration. GET /server/plugins/integrations/list reports two entries where three providers are actually registered; tickets is invisible to that endpoint (though still functional via callHook/hasHook, which key on providerFor not name). Fix belongs either in liq-integrations-issues-github (supply distinct name values) or in plugable-express's de-duplication key. Captured as present-day, deliberately-preserved behavior in core-server's phase-03 baseline test and snapshot; out of scope for the domain-consolidation absorption plan.
