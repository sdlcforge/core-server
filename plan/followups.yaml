    - title: Task dispatch env cwd mismatch observed
      id: WvMQ
      date: "2026-08-13"
      tags:
        - type:ambiguity
        - priority:unspecified
        - effort:unspecified
      text: During ad-hoc followup remediation (2026-08-13), a task agent dispatched with worktree /Users/zane/playground/sdlcforge/core-server/worktrees/task/refresh-deps-for-serverhome-fi reported that its harness-provided <env> block's stated working directory pointed to a different, unrelated worktree (worktrees/task/fix-test-env-var-isolation) than the one specified in its own task instructions. The agent correctly used the task-instruction-specified path throughout and never touched the mismatched one, so no harm resulted, but the discrepancy itself (dispatch pipeline's env/cwd header vs. the intended worktree) may be worth investigating if it recurs or causes an agent to act in the wrong worktree in a future dispatch.
    - title: yalc push propagated stale build once
      id: CJ9P
      date: "2026-08-14"
      tags:
        - type:ambiguity
        - plan/phase:yalc-dependency-refresh
        - plan/slug:pluggable-express-rename
        - priority:unspecified
        - effort:unspecified
      text: 'During phase-3 (yalc-dependency-refresh) task execution, the manager''s pre-dispatch `yalc push` from plugable-express propagated a dist build that was stale relative to plugable-express''s own current main branch (missing a registerPathVar plugin-setup parameter that liq-credentials needs to start up), which briefly broke core-server''s local server startup. The dispatched task agent resolved it (forced rebuild + re-push from plugable-express, source untouched, per the task doc''s own re-push contingency) and re-verified. Root cause not investigated further: worth checking whether plugable-express''s prepack/make build has an mtime-gating or lifecycle-script issue that could cause a stale dist/ to be packed on a future yalc push.'
    - title: IntegrationsManager de-dup collapses provider
      id: uROI
      date: "2026-08-24"
      tags:
        - type:bug
        - plan/phase:absorption-baseline
        - plan/slug:core-server-domain-consolidation
        - priority:unspecified
        - effort:unspecified
      text: IntegrationsManager.listInstalledPlugins() (in @liquid-labs/plugable-express) de-duplicates its provider list via new Map(list.map((p) => [p.name, p])). Both register() call sites in @liquid-labs/liq-integrations-issues-github's setup (tickets and pull request providers) omit the name field, so both are keyed on undefined and the Map collapses them into one entry — the later pull request registration silently overwrites the earlier tickets registration. GET /server/plugins/integrations/list reports two entries where three providers are actually registered; tickets is invisible to that endpoint (though still functional via callHook/hasHook, which key on providerFor not name). Fix belongs either in liq-integrations-issues-github (supply distinct name values) or in plugable-express's de-duplication key. Captured as present-day, deliberately-preserved behavior in core-server's phase-03 baseline test and snapshot; out of scope for the domain-consolidation absorption plan.
