      text: 'Real bug discovered, out of scope to fix in this task: loading the actual explicit-plugin set (skipCorePlugins: false, the production default) throws inside appInit() - liq-credentials, liq-credentials-db, liq-integrations, and liq-work still read app.ext.serverHome, which @liquid-labs/plugable-express no longer sets after its serverHome->serverConfigRoot rename. appInit() currently cannot successfully load the real explicit-plugin set at all, in any environment - not just under test. Candidate follow-up task; until resolved, no test (and arguably no real server run) can exercise the full core-routes-plus-every-loaded-plugin surface. Full write-up in plan/resources/golden-api-spec-baseline.md.'
