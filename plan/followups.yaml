      text: finalize-task-commit.sh's yalc-override guard excludes any bun.lock refresh from its automated commit in this repo, since bun.lock permanently carries file:.yalc/... entries by design here. This task's bun.lock was committed manually as a documented workaround. Worth considering a per-project exception to that guard, or documenting manual follow-up commit as the accepted pattern for yalc-refresh tasks in bun-based repos.
