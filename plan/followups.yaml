    - title: create.mjs response discloses abs path
      id: qYuq
      date: "2026-09-06"
      tags:
        - type:security
        - priority:unspecified
        - effort:unspecified
        - plan/slug:sdlc-core-unification
        - plan/phase:absorb-dev-core
      text: |-
        POST /orgs/create/:newOrgKey's 2xx response body's directory field (src/orgs/handlers/create.mjs, response construction) echoes back the fully resolved absolute filesystem path (built from fsPath.resolve(localDataRoot)). When the caller supplies a relative localDataRoot, the response discloses the server's absolute directory layout (e.g. the playground root's absolute parent path) to the caller. Does not by itself enable an attack — the containment check restricts where the directory can actually be created regardless of what is echoed back — but is a minor server-filesystem-layout disclosure. If server filesystem layout is considered sensitive in this deployment context, return a playground-root-relative path instead, or omit the directory field and return only the caller-supplied newOrgKey.

