    - title: finalize-task-commit.sh's yalc-override guard
      id: Z2Ar
      date: "2026-08-25"
      tags:
        - type:ambiguity
        - plan/phase:in-tree-plugin-mechanism
        - plan/slug:core-server-domain-consolidation
