    - title: project-lifecycle test pre-existing failure
      id: 2aMD
      date: "2026-08-18"
      tags:
        - plan/phase:phase-02-liq-projects-migration
        - plan/slug:dev-core-consolidation
        - type:bug
        - priority:unspecified
        - effort:unspecified
      text: 'src/projects/handlers/_lib/test/project-lifecycle.test.mjs fails independently of credentials/network: its appMock supplies app.ext.serverHome while create-lib.mjs reads app.ext.serverConfigRoot (both files byte-identical to the liq-projects donor''s blobs, not touched by the phase-2 absorb task). A real pre-existing donor defect, not a regression from absorption. Will keep make test/make qa red in dev-core until fixed. Phase 3''s verify-dev-core-absorption task (and any future full-suite gate) should not expect a fully-green make qa because of this one suite. Also note: src/projects/handlers/test/close-implied.mjs is a misnamed test file (missing the .test infix) that Jest never collects — dead in both directions, migrated verbatim from liq-projects per scope fence.'
    - title: Command injection risk in projects shell-outs
      id: g23a
      date: "2026-08-18"
      tags:
        - plan/phase:phase-02-liq-projects-migration
        - plan/slug:dev-core-consolidation
        - type:security
        - priority:unspecified
        - effort:unspecified
      text: 'Automated security review flagged 4 pre-existing command-injection-capable patterns in code migrated verbatim from liq-projects during this session''s dev-core-consolidation absorption (phase 2 task 002): src/projects/handlers/_lib/create-lib.mjs (shell.exec building a `hub create` command from newProjectName/githubOwner/orgKey), src/projects/handlers/_lib/rename-lib.mjs (shell.exec building `git remote set-url` from newName/projectPath), src/projects/handlers/releases/_lib/do-npm-publish.mjs (tryExec building `npm publish` with an OTP/tag), and src/projects/handlers/releases/_lib/publish-lib.mjs (tryExec building `git checkout -b` from a release-branch name). Confirmed via git log that these patterns predate this consolidation (commits 841f543/69de4e7/bacc1f0 in liq-projects, well before this plan) — the absorption task''s own git mv/merge carried them across with zero content-line changes, consistent with D11''s no-behavior-change rule. Not introduced by this session; now first-party dev-core code rather than a vendored dependency. Suggested remediation when next touched: replace shell-string interpolation with execFile/spawn argv-array invocation, and validate the interpolated values (project names, branch names, OTP) against strict allowlist regexes before use.'
    - title: octocache/octokit chain high-sev advisory
      id: pWxw
      date: "2026-08-18"
      tags:
        - plan/phase:phase-02-liq-projects-migration
        - plan/slug:dev-core-consolidation
        - type:security
        - priority:unspecified
        - effort:unspecified
      text: 'Security review (phase 2 gate) flagged: the liq-projects absorption''s dependency union added @liquid-labs/octocache (^1.0.0-alpha.4), which pins an octokit chain resolving to octokit<=3.1.1. npm audit --package-lock-only confirms an unpatched high-severity advisory GHSA-pwfr-8pq7-x9qv ("Unauthenticated Denial of Service in the octokit/webhooks library", CVSS 8.2) plus two moderate ReDoS advisories (GHSA-rmvr-2pp2-xj38 in @octokit/request, GHSA-xx4v-prfh-6cgc in @octokit/request-error). Also affects @liquid-labs/github-toolkit, @liquid-labs/credentials-db-plugin-github, and @liquid-labs/liq-credentials-db via the same root cause. Confirmed newly introduced by this diff (dev-core had no dependencies block before phase 2). Distinct from followups 0RpG (serialize-javascript/rollup-terser) and AEsA (sdlc-resource-babel-and-rollup deprecation) and from g23a (command injection) — do not conflate. Dev-core does not control @liquid-labs/octocache''s own octokit pin; a fix requires a semver-major bump upstream, out of scope for this phase. Reachability of the specific webhook-DoS code path from dev-core''s actual GitHub-integration usage (authenticated API calls, not inbound webhook processing) is unconfirmed and worth checking before prioritizing.'
    - title: Absorb task-doc template needs updates
      id: IxJv
      date: "2026-08-18"
      tags:
        - plan/slug:dev-core-consolidation
        - type:documentation
        - priority:unspecified
        - effort:unspecified
      text: 'Lessons from the third (liq-work) absorption, for whoever plans/executes the fourth (plugable-projects-audit): (1) Task-doc templates'' requirement/validation text ("git rm -r plan/", "git ls-files | grep ''^plan/'' must be empty") is stale — the committed contract correctly scopes plan/ removal to only the arriving donor paths, preserving dev-core''s own plan/followups.yaml, but the task-doc template text hasn''t been updated to match (liq-projects and liq-work absorb tasks both had to override it in the same way). (2) Task-doc "Assumptions" sections describing dev-core''s pre-merge test baseline as "5 failing suites via the Node 26 SlowBuffer defect" are wrong once liq-projects/liq-work have landed: dev-core''s actual baseline is 1 failing suite (project-lifecycle, followup 2aMD) — the SlowBuffer preload shim ends up NOT needed to load dist/dev-core.js at all (only needed for a donor''s own standalone bundle when measuring its pre-absorption baseline), because dev-core''s resolved dependency tree/lockfile differs enough from any single donor''s own lockfile that it never hits the SlowBuffer code path. work-db.test.js, for example, actually passes in dev-core despite failing in liq-work standalone. Whoever authors/runs the plugable-projects-audit absorption should expect this and not be surprised by a "better than predicted" green result.'
    - title: Command injection risk in work shell-outs
      id: AhMK
      date: "2026-08-18"
      tags:
        - plan/phase:phase-08-liq-work-migration
        - plan/slug:dev-core-consolidation
        - type:security
        - priority:unspecified
        - effort:unspecified
      text: 'Automated security review flagged 7 pre-existing command-injection-capable patterns in code migrated verbatim from liq-work during this session''s dev-core-consolidation absorption (phase 8 task 002): src/work/handlers/_lib/save-lib.mjs (git commit -m built via tryExec, partial escaping via replaceAll but not fully safe), src/work/handlers/_lib/work-db.mjs (git remote add with ghUser/projectBasename interpolation), src/work/handlers/resume.mjs (git checkout ${workKey}), src/work/handlers/issues/_lib/list-lib.mjs (open with ghOrg/project/number interpolation), src/work/handlers/_lib/submit-lib.mjs (open ${url} unquoted), src/work/handlers/_lib/pause-lib.mjs (git checkout ${main}), src/work/handlers/projects/_lib/list-lib.mjs (open with projectFQN interpolation). Confirmed via git log that these files'' shell-out patterns predate this consolidation (liq-work commits well before this plan). Not introduced by this session; now first-party dev-core code rather than a vendored dependency. Same class of issue as followup g23a (liq-projects'' shell-outs). Suggested remediation when next touched: replace shell-string interpolation with execFile/spawn argv-array invocation, and validate interpolated values (branch names, org/project names, URLs, issue numbers) against strict allowlist regexes before use.'
    - title: condition-eval Function() eval pattern
      id: 7ZF2
      date: "2026-08-18"
      tags:
        - plan/phase:phase-08-liq-work-migration
        - plan/slug:dev-core-consolidation
        - type:security
        - priority:unspecified
        - effort:unspecified
      text: 'Security review (phase 8 gate) noted: the new dependency @liquid-labs/condition-eval (added by liq-work''s absorption, resolving to 1.0.0-alpha.19) evaluates expressions via Function(e(o))() gated by a regex allowlist (numeric literals, true/false, fixed operator/paren set) — a regex-then-Function() pattern with a history of allowlist-bypass issues in other libraries, though this allowlist looks reasonably tight. Reachability from externally-influenced input (issue title/body, GitHub label, user-supplied work parameter) could not be confirmed since the review was scoped to dev-core''s aggregator/docs/package.json changes, not src/work/''s own handler source where condition-eval is actually called. Low confidence, minor severity. When src/work/''s own handler source is next reviewed, grep for condition-eval/Evaluator/evalTruth/evalNumber call sites and confirm every expression string is either a fixed developer-authored template or built only from already-validated/typed values, never a raw external string concatenated into the expression shape.'
    - title: Fix inherited projects-audit defects
      id: bTGn
      date: "2026-08-18"
      tags:
        - type:bug
        - plan/slug:dev-core-consolidation
        - priority:unspecified
        - effort:unspecified
      text: 'Four pre-existing defects inherited as-is (D11: no behavior change during absorption) from @liquid-labs/plugable-projects-audit into @sdlcforge/dev-core''s src/projects-audit/ submodule (absorbed by the dev-core-consolidation plan, phase-12 task 002): (1) the two implied endpoints advertise a projectName parameter they cannot use — getAuditEndpointParameters/getAuditFixEndpointParameters spread commonAuditPathParameters for both the named and implied variants, but the implied paths carry no :projectName; the project comes from the X-CWD header instead. (2) A typo drops one parameter''s help text from the API spec: audit-fix-lib.mjs''s removePackages parameter object spells its key "dascription" rather than "description". (3) An unknown project name yields a 500, not a 404 — both libs immediately destructure the result of getProjectData(projectName), which returns undefined for an unknown name, so the destructuring throws a TypeError. (4) Four prose typos are published in user-facing help text: "Auidts" (audit-lib.mjs''s summary), and "reomved", "pacagkes", "specificatinos" (audit-fix-lib.mjs''s description/parameter help), plus a double space in "${workDesc} project  security". A fifth, purely internal item: all four handlers assign reporter = reporter.isolate() and never read it — dead code, no user-visible effect. Fixing (1) or (2) changes the generated API spec, which is why D11 barred fixing them during consolidation. dev-core/README.md''s "Known defects (projects-audit submodule)" subsection references this followup by id.'
    - title: providerFor typo breaks pull-request hook
      id: OmUC
      date: "2026-09-01"
      tags:
        - type:bug
        - priority:low
        - effort:unspecified
      text: |-
        `src/work/handlers/_lib/answer-set-to-md.mjs:74` calls `app.ext.integrations` with `providerFor: 'pull requests'` (plural), while every other call site in the codebase uses the singular `'pull request'`. `IntegrationsManager.callHook`/`hasHook` match on exact `providerFor` string, so this mismatched entry throws `No provider found` at request time instead of resolving the registered provider — a live, reachable defect, not merely cosmetic.

        Surfaced during the `dev-core-plugin-manifest` plan's `analyze-change-request` pass (task doc `002-author-plugin-manifest.md`'s research), which noted independent corroboration: `@liquid-labs/plugable-express`'s own `diff-manifest.js` header cites this exact typo as its motivating example for why manifest-derivation tooling matters.

        Out of scope for the plugin-manifest plan (runtime code, not manifest declarations). Fix: change `'pull requests'` to `'pull request'` at that call site, plus a regression test asserting the hook resolves.
