    - title: provision-local-deps.sh misses 2 .yalc deps
      id: 0qOH
      date: "2026-08-11"
      tags:
        - type:security
        - plan/phase:bun-package-management
        - plan/slug:bun-conversion
        - priority:unspecified
        - effort:unspecified
      text: 'Phase 1 security review (phase-review, bun-conversion): scripts/provision-local-deps.sh''s presence check and failure message only account for @liquid-labs/plugable-express and @liquid-labs/liq-projects, but bun.lock actually resolves two more file:.yalc/... deps transitively: @liquid-labs/github-toolkit (via liq-work) and @liquid-labs/http-smart-response (via plugable-projects-audit). A checkout with only the two documented packages under .yalc/ will still fail bun install deep in resolution, with no actionable guidance. AGENTS.md''s new CI policy statement ("CI does not attempt to resolve file:.yalc/... links") is also not achievable as stated for liq-work/plugable-projects-audit at their pinned versions. Root fix may be requesting upstream republish of those two packages with proper registry-resolvable deps, or extending the script''s coverage — needs a decision, not a mechanical fix.'
    - title: Symlink hardening in seedServerSettings
      id: YZIu
      date: "2026-08-11"
      tags:
        - type:security
        - plan/phase:bun-package-management
        - plan/slug:bun-conversion
        - priority:unspecified
        - effort:unspecified
      text: 'Phase 1 security review (phase-review, bun-conversion), low confidence/suggestion: src/lib/app-init.mjs''s seedServerSettings() checks existsSync(destPath) then copyFile with no exclusive-create flag; a dangling symlink at the destination would have its target overwritten. Requires attacker to already have write access to the parent dir (normally single-user $HOME/.local/share) — not new remote attack surface, mirrors plugable-express''s own existing write-if-absent pattern. If hardening is desired: use fs.constants.COPYFILE_EXCL and treat failure as a normal non-fatal seed failure.'
    - title: Symlink hardening in provision-local-deps.sh
      id: PAof
      date: "2026-08-11"
      tags:
        - type:security
        - plan/phase:bun-package-management
        - plan/slug:bun-conversion
        - priority:unspecified
        - effort:unspecified
      text: 'Phase 1 security review (phase-review, bun-conversion), low confidence/suggestion: scripts/provision-local-deps.sh''s `cp -R "$MAIN_CHECKOUT/.yalc" "$CURRENT_DIR/.yalc"` preserves symlinks rather than dereferencing. If the main checkout''s gitignored .yalc/ ever contained a symlink pointing outside the intended tree, this script propagates it into every new task worktree. Requires attacker to already have write access to the developer''s local .yalc/ — pre-existing local-compromise-level trust, not new remote attack surface. If hardening is desired: use `cp -RL` or add a post-copy symlink rejection check.'
    - title: architecture.md missing XDG config decision
      id: xmfg
      date: "2026-08-11"
      tags:
        - type:conflict
        - plan/phase:bun-package-management
        - plan/slug:bun-conversion
        - priority:unspecified
        - effort:unspecified
      text: 'Phase 1 architecture review (phase-review, bun-conversion), major: docs/architecture.md''s Key decisions section has no entry for task 004''s specific decision — moving serverConfigRoot from package-relative to an XDG-based path via COMPLY_SERVER_CONFIG_ROOT(), plus the new seedServerSettings first-run mechanism that copies packaged server-settings.yaml into the new root. The general "config centralized through comply-defaults" principle is recorded, but not this specific, non-obvious design choice, which the task''s own architectural_impact:true flag calls out. Expected to be picked up by phase 4 task 001 (update-architecture-docs) — not a code defect, does not block phase 1/2/3 progress.'
